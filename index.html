<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mushroom Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <div id="title">The Mushroom Game</div>
        <div id="timer">Time: <span id="time">60</span></div>
        <img id="mushroom" src="Mushroom.png" alt="Mushroom">
        <div id="instructions">WASD to Move</div>
        <button id="hardMode">Hard Mode</button>
        <div id="message">
            <h2 id="messageTitle"></h2>
            <p id="messageText"></p>
            <button id="restart">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
